<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Confirma tu correo en Habify</title></head>
<body style="margin:0;padding:32px 16px;background:#141426;color:#eee8f5;font-family:Arial,sans-serif;">
  <table role="presentation" style="max-width:520px;width:100%;margin:auto;background:#202038;border:1px solid #454064;border-radius:12px;">
    <tr><td style="padding:32px;">
      <p style="margin:0 0 24px;color:#e5b859;letter-spacing:4px;font-weight:bold;">HABIFY</p>
      <h1 style="font-size:24px;margin:0 0 20px;color:#fff7e5;">Confirma tu correo</h1>
      <p style="font-size:16px;line-height:1.7;">Recibimos una solicitud para crear una cuenta. Usa este enlace para verificar tu correo electrónico:</p>
      <p style="margin:28px 0;"><a href="{{ .ConfirmationURL }}" style="display:inline-block;background:#8256c6;color:#ffffff;padding:15px 24px;border-radius:6px;text-decoration:none;font-weight:bold;">Confirmar mi correo</a></p>
      <p style="font-size:14px;line-height:1.7;color:#cbc5dc;">Si el enlace ha vencido, solicita otro desde Habify. Si no creaste esta cuenta, puedes ignorar este mensaje.</p>
    </td></tr>
  </table>
</body>
</html>
